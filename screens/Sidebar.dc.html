<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; font-family: Inter, system-ui, sans-serif; color: #15171E; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
    <div style="width: 32px; height: 32px; border-radius: 9px; background: #2F55D4; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
    </div>
    <span style="font-weight: 700; font-size: 17px; letter-spacing: -0.2px">Connekted</span>
  </div>
  <a href="Login.dc.html#pick" aria-label="Switch workspace" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E4E2DC; background: #FFFFFF; font: 600 13.5px Inter, system-ui, sans-serif; color: #15171E; text-decoration: none">
    <span>Apex Solar</span>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6070" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
  </a>
  <button type="button" onClick="{{ ask }}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E4E2DC; background: #F6F5F2; font: 500 13.5px Inter, system-ui, sans-serif; color: #5B6070; cursor: pointer">
    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B6070" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="flex: 1; text-align: left">Search or ask</span>
    <span style="font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid #D6D3CC">Ctrl K</span>
  </button>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="10">
      <a href="{{ item.href }}" style="{{ item.style }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ item.d }}"></path></svg>
        <span style="flex: 1">{{ item.label }}</span>
        <sc-if value="{{ item.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: #2F55D4; color: #FFFFFF">{{ item.badge }}</span></sc-if>
      </a>
    </sc-for>
  </div>
  <a href="LiveCall.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 9px; background: #E3F4E8; color: #14672F; font-weight: 600; font-size: 13.5px; text-decoration: none">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #15803D"></span>
    <span style="flex: 1">2 calls live now</span>
    <span>Listen</span>
  </a>
  <div style="flex: 1"></div>
  <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: #F6F5F2; text-decoration: none; color: #15171E">
    <span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span>Getting started</span><span style="color: #2F55D4">4 of 5</span></span>
    <span style="display: block; height: 6px; border-radius: 3px; background: #E4E2DC"><span style="display: block; width: 80%; height: 6px; border-radius: 3px; background: #2F55D4"></span></span>
  </a>
  <a href="Settings.dc.html" style="{{ settingsStyle }}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    <span>Settings</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","inbox","agents","campaigns","automations","contacts","companies","deals","calls","reports","settings"],"default":"home"},"$preview":{"width":232,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = 'display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:9px;text-decoration:none;font-size:14px;';
    const on = base + 'background:#E8EDFF;color:#1E3A8A;font-weight:600';
    const off = base + 'color:#3A3D46;font-weight:500';
    const list = [
      { key: 'home', label: 'Home', href: 'Main.dc.html', d: 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z' },
      { key: 'inbox', label: 'Inbox', href: 'Inbox.dc.html', d: 'M3 13h5l1.5 3h5L16 13h5M5.5 5h13L21 13v6H3v-6z', badge: '2' },
      { key: 'agents', label: 'Agents', href: 'Agents.dc.html', d: 'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3' },
      { key: 'campaigns', label: 'Campaigns', href: 'Campaigns.dc.html', d: 'M4 10v4h3l6 4V6l-6 4zM17 9a4 4 0 0 1 0 6' },
      { key: 'automations', label: 'Automations', href: 'Automations.dc.html', d: 'M13 2 4 14h7l-1 8 9-12h-7z' },
      { key: 'contacts', label: 'Contacts', href: 'Contacts.dc.html', d: 'M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8' },
      { key: 'companies', label: 'Companies', href: 'Companies.dc.html', d: 'M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4' },
      { key: 'deals', label: 'Deals', href: 'Deals.dc.html', d: 'M3 7h18v13H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' },
      { key: 'calls', label: 'Calls', href: 'Calls.dc.html', d: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z' },
      { key: 'reports', label: 'Reports', href: 'Reports.dc.html', d: 'M4 20V11M10 20V4M16 20v-7M2 20h20' }
    ];
    return {
      items: list.map((i) => ({ ...i, style: i.key === active ? on : off, hasBadge: !!i.badge })),
      settingsStyle: active === 'settings' ? on : off,
      ask: () => window.dispatchEvent(new CustomEvent('cx-assistant'))
    };
  }
}
</script>
</body>
</html>
