<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ct{display:flex;flex-wrap:wrap;flex:1;min-height:0}
.ct-f{flex:0 0 220px;box-sizing:border-box;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:1px}
.ct-f .hd{font-size:12px;font-weight:500;color:var(--faint);padding:14px 10px 4px}
.ct-t{flex:1 1 560px;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.cts{table-layout:fixed;min-width:720px}
.cts td{height:58px;padding-top:0;padding-bottom:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cts th,.cts td{padding-left:18px}
.cts th:first-child,.cts td:first-child{width:44px;padding-left:18px;padding-right:0}
.who{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.who:hover b{color:var(--blue)}
.who b{font-weight:500}
.cb{width:16px;height:16px;accent-color:var(--blue)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:var(--blue-t2);border-bottom:1px solid var(--blue-b)}
@media (max-width:760px){.ct-f{flex:1 1 100%;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}.ct-f .hd{display:none}}
</style>
</helmet>
<div class="shell">
  <div class="side"><dc-import name="Sidebar" active="contacts"></dc-import></div>
  <main class="main flush">
    <div class="bar">
      <h1 class="title">Contacts</h1>
      <label class="search" style="flex:0 1 280px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mut)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="sr">Search contacts</span><input id="ct-q" type="search" placeholder="Search name or phone" value="{{ q }}" onInput="{{ search }}"></label>
      <button type="button" class="btn2">Import</button>
      <button type="button" class="btn"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add contact</button>
    </div>
    <div class="ct">
      <aside class="ct-f" aria-label="Views">
        <sc-for list="{{ stages }}" as="v">
          <div class="vnav"><button type="button" aria-pressed="{{ v.pressed }}" onClick="{{ v.pick }}"><span class="{{ v.dot }}"></span>{{ v.label }}<span class="n">{{ v.n }}</span></button></div>
        </sc-for>
        <div class="hd">Lists</div>
        <sc-for list="{{ lists }}" as="v">
          <div class="vnav"><button type="button" aria-pressed="{{ v.pressed }}" onClick="{{ v.pick }}">{{ v.label }}<span class="n">{{ v.n }}</span></button></div>
        </sc-for>
      </aside>

      <section class="ct-t" aria-label="Contact list">
        <sc-if value="{{ anySel }}">
          <div class="bulk">
            <b style="font-weight:500">{{ selCount }} selected</b>
            <a class="btn sm" href="Campaign.dc.html">Add to campaign</a>
            <button type="button" class="btn2 sm">Call with agent</button>
            <button type="button" class="btn2 sm">Send WhatsApp</button>
            <button type="button" class="btn3 sm" onClick="{{ clearSel }}">Clear</button>
          </div>
        </sc-if>
        <div class="scroll-x">
          <table class="cts">
            <colgroup><col style="width:44px"><col style="width:30%"><col style="width:20%"><col style="width:16%"><col style="width:20%"><col style="width:14%"></colgroup>
            <thead><tr><th><input type="checkbox" class="cb" aria-label="Select all" onChange="{{ selAll }}" checked="{{ allSel }}"></th><th>Name</th><th>Phone</th><th>Stage</th><th>Last call</th><th>Can call</th></tr></thead>
            <tbody>
              <sc-for list="{{ rows }}" as="c">
                <tr class="{{ c.cls }}">
                  <td><input type="checkbox" class="cb" aria-label="{{ c.selLabel }}" checked="{{ c.sel }}" onChange="{{ c.toggle }}"></td>
                  <td><a class="who" href="Contact.dc.html"><span class="av" style="{{ c.av }}">{{ c.ini }}</span><b>{{ c.name }}</b></a></td>
                  <td>{{ c.phone }}</td>
                  <td><span class="{{ c.stagePill }}">{{ c.stage }}</span></td>
                  <td class="small">{{ c.last }}</td>
                  <td><span class="{{ c.canPill }}">{{ c.can }}</span></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <div class="between small muted" style="padding:10px 18px;border-top:1px solid var(--line2)"><span>{{ countText }}</span><a href="#" style="text-decoration:none">2 possible duplicates · Review</a></div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'all', q: '', sel: {} };
  }
  renderVals() {
    const s = this.state;
    const av = (bg, fg) => 'background:' + bg + ';color:' + fg;
    const C = [
      { id: 1, name: 'Priya Nair', phone: '+91 98450 ••12', stage: 'Qualified', last: 'Visit booked · today', can: 'Yes', lists: ['hot', 'visit'] },
      { id: 2, name: 'Rahul Menon', phone: '+91 99610 ••48', stage: 'Lead', last: 'Needs review · yesterday', can: 'Yes', lists: ['hot'] },
      { id: 3, name: 'Anjali Das', phone: '+91 90370 ••05', stage: 'Lead', last: 'No answer · yesterday', can: 'SMS opt-out', lists: [] },
      { id: 4, name: 'Vikram Rao', phone: '+91 97400 ••77', stage: 'Lost', last: 'Not interested · Mon', can: 'Do not call', lists: [] },
      { id: 5, name: 'Suresh K', phone: '+91 94470 ••90', stage: 'Customer', last: 'Answered · Tue', can: 'Yes', lists: ['amc'] },
      { id: 6, name: 'Arun Pillai', phone: '+91 98950 ••21', stage: 'Lead', last: '—', can: 'Yes', lists: ['hot'] },
      { id: 7, name: 'Meera Joseph', phone: '+91 97470 ••64', stage: 'Qualified', last: 'Quote opened · Wed', can: 'Yes', lists: ['visit'] },
      { id: 8, name: 'Deepa Krishnan', phone: '+91 94470 ••33', stage: 'Lead', last: 'On a call now', can: 'Yes', lists: [] },
      { id: 9, name: 'Thomas George', phone: '+91 96330 ••18', stage: 'Customer', last: 'Answered · 12 Oct', can: 'Yes', lists: ['amc'] }
    ];
    const colors = [['#E2F3EE', '#0A6550'], ['#FCEDE4', '#8F3A0E'], ['#EAEEFC', '#1D338C'], ['#F0EAFB', '#5B2FA6'], ['#EEF0EE', '#3B404B']];
    const STAGES = [['all', 'Everyone', ''], ['Lead', 'Leads', 'dot'], ['Qualified', 'Qualified', 'dot b'], ['Customer', 'Customers', 'dot g'], ['Lost', 'Lost', 'dot o']];
    const stages = STAGES.map(([id, label, dot]) => ({ label, dot: dot || 'dot', n: id === 'all' ? C.length : C.filter((c) => c.stage === id).length, pressed: s.view === id ? 'true' : 'false', pick: () => this.setState({ view: id }) }));
    stages[0].dot = 'sr';
    const LISTS = [['hot', 'Hot leads this week'], ['visit', 'Site visit pending'], ['amc', 'Service contract (AMC)']];
    const lists = LISTS.map(([id, label]) => ({ label, n: C.filter((c) => c.lists.includes(id)).length, pressed: s.view === id ? 'true' : 'false', pick: () => this.setState({ view: id }) }));
    const q = s.q.trim().toLowerCase();
    const shown = C.filter((c) => (s.view === 'all' || c.stage === s.view || c.lists.includes(s.view)) && (!q || c.name.toLowerCase().includes(q) || c.phone.includes(q)));
    const stagePill = { Lead: 'pill', Qualified: 'pill b', Customer: 'pill g', Lost: 'pill o' };
    const rows = shown.map((c, i) => ({
      ...c, ini: c.name.split(' ').map((w) => w[0]).join('').slice(0, 2), av: av(...colors[c.id % colors.length]),
      stagePill: stagePill[c.stage], canPill: c.can === 'Yes' ? 'pill g' : 'pill o',
      sel: !!s.sel[c.id], cls: s.sel[c.id] ? 'sel' : '', selLabel: 'Select ' + c.name,
      toggle: (e) => this.setState({ sel: Object.assign({}, s.sel, { [c.id]: e.target.checked }) })
    }));
    const selCount = Object.values(s.sel).filter(Boolean).length;
    return {
      q: s.q, search: (e) => this.setState({ q: e.target.value }),
      stages, lists, rows, countText: shown.length + (shown.length === 1 ? ' contact' : ' contacts'),
      anySel: selCount > 0, selCount, clearSel: () => this.setState({ sel: {} }),
      allSel: shown.length > 0 && shown.every((c) => s.sel[c.id]),
      selAll: (e) => { const m = {}; shown.forEach((c) => { m[c.id] = e.target.checked; }); this.setState({ sel: Object.assign({}, s.sel, m) }); }
    };
  }
}
</script>
</body>
</html>
