<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analytics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.an{padding:0 0 40px}
.an .tabs{padding:0 18px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 18px 0}
.kp{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kp .l{font-size:13px;color:var(--mut)}
.kp .v{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
.kp .d{font-size:12.5px;color:var(--mut)}
.kp .d b{font-weight:500;color:var(--teal-ink)}
.kp.warn{background:#FFFAF6;border-color:var(--warn-b)}
.kp.warn .v,.kp.warn .d{color:var(--warn-ink)}
.ch{border:1px solid var(--line);border-radius:12px;padding:16px 18px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch h2{font-size:14px;font-weight:600}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch .ax{font-size:10px;fill:#8A909C;font-family:var(--font)}
.ch rect.hit:hover+rect,.ch rect.m:hover{opacity:.8}
.hb{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.hb .tr{height:10px;border-radius:5px;background:var(--fog);overflow:hidden}
.hb .tr span{display:block;height:100%;border-radius:5px}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
</style>
</helmet>
<div class="shell">
  <div class="side"><dc-import name="Sidebar" active="reports"></dc-import></div>
  <main class="main flush">
    <div class="bar"><h1 class="title">Analytics</h1></div>
    <div class="an">
      <div class="tabs" role="tablist" aria-label="Dashboards">
        <sc-for list="{{ tabs }}" as="t"><button type="button" role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for>
        <button type="button" aria-label="New dashboard" title="New dashboard">+</button>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Date range"><sc-for list="{{ ranges }}" as="r"><button type="button" aria-pressed="{{ r.pressed }}" onClick="{{ r.pick }}">{{ r.label }}</button></sc-for></div>
        <button type="button" class="btn2 sm"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"></path></svg>Filter</button>
        <span style="flex:1"></span>
        <button type="button" class="btn2 sm">Share</button>
        <button type="button" class="btn2 sm"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add chart</button>
      </div>

      <div class="grid4">
        <sc-for list="{{ kpis }}" as="k">
          <div class="{{ k.cls }}"><span class="l">{{ k.l }}</span><span class="v">{{ k.v }}</span><span class="d">{{ k.d }}</span></div>
        </sc-for>
      </div>

      <div class="grid2">
        <section class="ch" aria-labelledby="c1">
          <h2 id="c1">Calls per day</h2>
          <svg viewBox="0 0 420 170" role="img" aria-label="{{ perDayAria }}">
            <line x1="0" y1="150" x2="420" y2="150" stroke="#E2E5E3"></line>
            <sc-for list="{{ perDay }}" as="b"><g><rect class="m" x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="3" fill="#2B4ACB"><title>{{ b.tip }}</title></rect><text class="ax" x="{{ b.cx }}" y="166" text-anchor="middle">{{ b.lbl }}</text></g></sc-for>
          </svg>
        </section>

        <section class="ch" aria-labelledby="c2">
          <h2 id="c2">How calls ended</h2>
          <div class="stack" style="gap:12px;padding:6px 0">
            <sc-for list="{{ outcomes }}" as="o">
              <div class="hb" title="{{ o.tip }}"><span>{{ o.l }}</span><span class="tr"><span style="{{ o.bar }}"></span></span><span style="text-align:right;font-weight:500">{{ o.n }}</span></div>
            </sc-for>
          </div>
        </section>

        <section class="ch" aria-labelledby="c3">
          <div class="between"><h2 id="c3">Average reply time</h2><span class="small muted">Dashed line: 1 s target</span></div>
          <svg viewBox="0 0 420 170" role="img" aria-label="{{ replyAria }}">
            <line x1="0" y1="150" x2="420" y2="150" stroke="#E2E5E3"></line>
            <line x1="0" y1="{{ targetY }}" x2="420" y2="{{ targetY }}" stroke="#0B8A6A" stroke-dasharray="4 4"></line>
            <path d="{{ replyLine }}" fill="none" stroke="#B4470F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
            <sc-for list="{{ replyPts }}" as="p"><circle cx="{{ p.x }}" cy="{{ p.y }}" r="8" fill="transparent"><title>{{ p.tip }}</title></circle></sc-for>
            <sc-for list="{{ replyLbls }}" as="l"><text class="ax" x="{{ l.x }}" y="166" text-anchor="middle">{{ l.t }}</text></sc-for>
          </svg>
        </section>

        <section class="ch" aria-labelledby="c4">
          <div class="between"><h2 id="c4">Best hour to call</h2><span class="small muted">Picked up by hour · best: <b style="color:var(--teal-ink);font-weight:500">5 pm</b></span></div>
          <svg viewBox="0 0 420 170" role="img" aria-label="{{ hourAria }}">
            <line x1="0" y1="150" x2="420" y2="150" stroke="#E2E5E3"></line>
            <sc-for list="{{ hours }}" as="b"><g><rect class="m" x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="3" fill="{{ b.fill }}"><title>{{ b.tip }}</title></rect><text class="ax" x="{{ b.cx }}" y="166" text-anchor="middle">{{ b.lbl }}</text></g></sc-for>
          </svg>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'calls', range: '30d' };
  }
  renderVals() {
    const s = this.state;
    const tabs = [['calls', 'Calls'], ['campaigns', 'Campaigns'], ['agents', 'Agents']].map(([id, label]) => ({ label, sel: s.tab === id ? 'true' : 'false', pick: () => this.setState({ tab: id }) }));
    const ranges = [['7d', '7 days'], ['30d', '30 days'], ['90d', '90 days']].map(([id, label]) => ({ label, pressed: s.range === id ? 'true' : 'false', pick: () => this.setState({ range: id }) }));
    const D = {
      '7d': { days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], calls: [8, 22, 31, 27, 35, 29, 12], k: ['164', '66%', '14', '5.2 s'], d: ['+12% vs last week', '+2 pts', '+3', 'Target about 1 s'] },
      '30d': { days: ['W1', 'W2', 'W3', 'W4'], calls: [74, 102, 118, 118], k: ['412', '64%', '38', '5.4 s'], d: ['+18% vs last month', '+3 pts', '+9', 'Target about 1 s'] },
      '90d': { days: ['Aug', 'Sep', 'Oct'], calls: [180, 296, 412], k: ['888', '61%', '71', '5.6 s'], d: ['+64% vs last quarter', '+5 pts', '+30', 'Target about 1 s'] }
    }[s.range];
    const kpis = [['Calls', 0], ['Picked up', 1], ['Visits booked', 2], ['Average reply time', 3]].map(([l, i]) => ({ l, v: D.k[i], d: D.d[i], cls: 'kp' + (i === 3 ? ' warn' : '') }));

    const bars = (vals, labels, unit, color) => {
      const max = Math.max(...vals), n = vals.length, gap = 10, w = Math.min(44, (420 - gap * (n - 1)) / n);
      const total = w * n + gap * (n - 1), x0 = (420 - total) / 2;
      return vals.map((v, i) => {
        const h = Math.max(2, Math.round(v / max * 130)), x = Math.round(x0 + i * (w + gap));
        return { x, y: 150 - h, w: Math.round(w), h, cx: Math.round(x + w / 2), lbl: labels[i], tip: labels[i] + ': ' + v + unit, fill: typeof color === 'function' ? color(v, max) : color };
      });
    };
    const perDay = bars(D.calls, D.days, ' calls', '#2B4ACB');

    const O = [['Visit booked', 38], ['Call me later', 61], ['Not interested', 97], ['No answer', 148], ['Asked not to call', 9]];
    const omax = Math.max(...O.map((o) => o[1]));
    const outcomes = O.map(([l, n]) => ({ l, n, tip: l + ': ' + n + ' calls', bar: 'width:' + Math.round(n / omax * 100) + '%;background:' + (l === 'Visit booked' ? '#0B8A6A' : '#2B4ACB') }));

    const R = [6.1, 5.9, 5.6, 5.8, 5.3, 5.4, 5.4];
    const RL = ['Week 1', '', '', 'Week 2', '', '', 'Now'];
    const ry = (v) => Math.round(150 - v / 7 * 130);
    const replyPts = R.map((v, i) => ({ x: Math.round(20 + i * (380 / (R.length - 1))), y: ry(v), tip: (RL[i] || 'Day ' + (i + 1)) + ': ' + v + ' s' }));
    const replyLine = replyPts.map((p, i) => (i ? 'L' : 'M') + p.x + ' ' + p.y).join(' ');
    const replyLbls = replyPts.map((p, i) => ({ x: p.x, t: RL[i] })).filter((l) => l.t);

    const H = [['9a', 41], ['10a', 58], ['11a', 66], ['12p', 52], ['1p', 38], ['2p', 47], ['3p', 55], ['4p', 61], ['5p', 72], ['6p', 69], ['7p', 48]];
    const hmax = Math.max(...H.map((h) => h[1]));
    const hours = bars(H.map((h) => h[1]), H.map((h) => h[0]), '% picked up', (v) => (v === hmax ? '#0B8A6A' : '#2B4ACB'));

    return {
      tabs, ranges, kpis, perDay, outcomes, replyPts, replyLine, replyLbls, targetY: ry(1), hours,
      perDayAria: 'Calls per period: ' + D.days.map((d, i) => d + ' ' + D.calls[i]).join(', '),
      replyAria: 'Average reply time over the last 7 days, from 6.1 to 5.4 seconds, against a 1 second target',
      hourAria: 'Pick-up rate by hour; best at 5 pm with ' + hmax + ' percent'
    };
  }
}
</script>
</body>
</html>
